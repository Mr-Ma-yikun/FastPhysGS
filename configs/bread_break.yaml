train:
  seed: 0
  gpu: 2
  model_path: 'dataset/bread'
  export_path: './outputs'
  train_tag: 
  epochs: 3
  enable_train: True
  ckpt_interval: 1
  ckpt_epoch: -1
  export_video: True
  video_interval: 1
  prompt: "A rubber bread breaking"

material:
  center: [0.5, 0.5, 0.5]
  size: [1.0, 1.0, 1.0]
  rho: 1000.0
  elasticity_physicals:
    #- 'SigmaElasticity'
    - 'CorotatedElasticity'
    #- 'StVKElasticity'
    #- 'VolumeElasticity'
  plasticity_physicals:
    - 'IdentityPlasticity'
    #- 'DruckerPragerPlasticity'
    #- 'SigmaPlasticity'
    #- 'VonMisesPlasticity'
  elasticity: 'LLM'
  plasticity: 'LLM'

render:
  white_bg: True
  mpm_space_vertical_upward_axis: [0, 0, 1]
  mpm_space_viewpoint_center: [2.3, 3.0, 0.9]
  default_camera_index: -1
  show_hint: False
  init_azimuthm: 170
  init_elevation: 20
  init_radius: 1.6
  move_camera: False
  delta_a: -2.4
  delta_e: 0.8
  delta_r: 0.0

preprocessing:
  scale_factor: 0.7
  opacity_threshold: 0.0
  rotation_degree: [0.0]
  rotation_axis: [0]
  sim_area: 
  particle_filling: 'True'

sim:
  num_grids: 25
  dt: 3e-4
  gravity: [0.0, 0.0, 0.0]
  num_frames: 150
  steps_per_frame: 10
  clip_bound: 0.5
  damping: 1.0
  obj_idx: [0]
  fill_nums: [20000]
  e_values: [3e4]
  boundary_conditions: 
  # 上下撕裂
    - type: 'enforce_particle_translation'
      point: [0.5, 0.5, 0.6]
      size: [0.5, 0.5, 0.15]
      velocity: [0, 0, 0.5]
      start_time: 0
      end_time: 0.2
    - type: 'enforce_particle_translation'
      point: [0.5, 0.5, 0.3]
      size: [0.5, 0.5, 0.15]
      velocity: [0, 0, -0.5]
      start_time: 0
      end_time: 0.2
    
      