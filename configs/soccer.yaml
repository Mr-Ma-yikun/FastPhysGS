train:
  seed: 0
  gpu: 2
  model_path: 'dataset/soccer'
  export_path: './outputs'
  train_tag: 
  epochs: 3
  enable_train: True
  ckpt_interval: 1
  ckpt_epoch: -1
  export_video: True
  video_interval: 1
  prompt: "a ball bouncing on a surface"

material:
  center: [0.5, 0.5, 0.5]
  size: [1.0, 1.0, 1.0]
  rho: 1000.0
  elasticity_physicals:
    # - 'SigmaElasticity'
    - 'CorotatedElasticity'
    - 'CorotatedElasticity'
    # - 'StVKElasticity'
    # - 'VolumeElasticity'
  plasticity_physicals:
    - 'IdentityPlasticity'
    # - 'DruckerPragerPlasticity'
    # - 'SigmaPlasticity'
    # - 'VonMisesPlasticity'
  elasticity: 'LLM'
  plasticity: 'LLM'

render:
  white_bg: True
  mpm_space_vertical_upward_axis: [0, 0, 1]
  mpm_space_viewpoint_center: [0.4, 0.4, 0.6]
  default_camera_index: -1
  show_hint: False
  init_azimuthm: 170
  init_elevation: 0
  init_radius: 0.6
  move_camera: False
  delta_a: -2.4
  delta_e: 0.8
  delta_r: 0.0

preprocessing:
  scale_factor: 0.7
  opacity_threshold: 0.0
  rotation_degree: [0.0]
  rotation_axis: [0]
  sim_area: 
  particle_filling: 'True'

sim:
  num_grids: 15
  dt: 3e-4
  gravity: [0.0, 0.0, 0.0]
  num_frames: 150
  steps_per_frame: 10
  clip_bound: 0.5
  damping: 0.999
  obj_idx: [0, 1]
  fill_nums: [150000, 150000]
  e_values: [4e1, 4e1]
  boundary_conditions: 
    - type: 'enforce_particle_translation'
      point: [0.3, 0.5, 0.5]
      size: [0.2, 0.4, 0.4]   
      velocity: [0.0, 0.0, 0.0]  
      start_time: 0.0
      end_time: 0.01
    - type: 'enforce_particle_translation'
      point: [0.8, 0.5, 0.5]
      size: [0.2, 0.4, 0.4]
      velocity: [-2.0, 0.0, 0.0]
      start_time: 0.0
      end_time: 0.01
    # - type: 'surface_collider'
    #   point: [1.0, 1.0, 0.02]
    #   normal: [0.0, 0.0, 1.0]
    #   surface: 'collide'
    #   friction: 0.0
    #   start_time: 0.0
    #   end_time: 1e3
    
      